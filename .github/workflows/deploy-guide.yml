name: Publish Pocket Pal guide

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Deploy the guide after you have enabled GitHub Pages'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pocket-pal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out assignment source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build documentation and Tailwind styles
        run: npm run build
      - name: Check content, snippets and local links
        run: npm run check
      - name: Package browser guide
        run: npm run site
      - name: Upload deployable guide
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Report validation result
        run: |
          echo '### Pocket Pal guide checks passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The guide artifact is ready. Publishing is a separate, manual step.' >> "$GITHUB_STEP_SUMMARY"
          echo 'After enabling Pages, run this workflow with deploy_pages checked.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure owner-enabled GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy guide
        id: deployment
        uses: actions/deploy-pages@v4
